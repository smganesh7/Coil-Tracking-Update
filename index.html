<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coil Tracking Update</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        th, td {
            text-align: center;
        }
    </style>
    <!-- Include SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <!-- Include jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <!-- Include jsPDF AutoTable for table formatting in PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <h1>Coil Tracking Update</h1>
    
    <form id="inventoryForm" action="https://cotrup.netlify/app/store_inventory.php" method="POST">
        <label for="product">Coil Number:</label>
        <input type="text" id="product" name="product" required><br><br>

        <label for="bay">Bay:</label>
        <select id="bay" name="bay">
            <option value="MN">MN</option>
            <option value="NP">NP</option>
            <option value="PQ">PQ</option>
            <option value="QR">QR</option>
            <option value="RS">RS</option>
            <option value="ST">ST</option>
        </select><br><br>
        
        <label for="column">Column:</label>
        <input type="text" id="column" name="column" maxlength="1" placeholder="A-Z" required oninput="this.value = this.value.toUpperCase()"><br><br>
        
        <label for="row">Row:</label>
        <input type="number" id="row" name="row" min="1" max="20" required><br><br>
        
        <button type="button" onclick="updateInventory()">Update Inventory</button>
    </form>
    
    <h2>Inventory Status</h2>
    <button type="button" onclick="downloadAsExcel()">Download as Excel</button>
    <button type="button" onclick="downloadAsPDF()">Download as PDF</button><br>
    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"> Select/Deselect All
    <button type="button" onclick="deleteSelectedEntries()">Delete Selected Entries</button><br><br>



    <div id="inventoryTable">
        <!-- Inventory table will be inserted here by JavaScript -->
    </div>
    
    <script>
        // Initialize or load inventory data from localStorage
        let inventory = JSON.parse(localStorage.getItem('inventory')) || {
            MN: {},
            NP: {},
            PQ: {},
            QR: {},
            RS: {},
            ST: {}
        };

        console.log('Loaded inventory:', inventory);

        // Function to update inventory
        function updateInventory() {
            const bay = document.getElementById('bay').value;
            const column = document.getElementById('column').value.toUpperCase();
            const row = document.getElementById('row').value;
            const product = document.getElementById('product').value;

            // Validate column and row inputs
            if (!/^[A-Z]$/.test(column)) {
                alert('Invalid column value. Please enter a single letter (A-Z).');
                return;
            }
            if (row < 1 || row > 20) {
                alert('Invalid row value. Please enter a number between 1 and 20.');
                return;
            }

            // Check for duplicate coil number at the same location
            let duplicateLocation = null;
            for (let b in inventory) {
                for (let c in inventory[b]) {
                    for (let r in inventory[b][c]) {
                        if (inventory[b][c][r] === product && !(b === bay && c === column && r === row)) {
                            duplicateLocation = `${b}-${c}-${r}`;
                            break;
                        }
                    }
                    if (duplicateLocation) break;
                }
                if (duplicateLocation) break;
            }

            if (duplicateLocation) {
                let [dupBay, dupColumn, dupRow] = duplicateLocation.split('-');
                if (!confirm(`Coil number ${product} is already in ${dupBay}-${dupColumn}-${dupRow}. Do you want to replace it with ${product} at ${bay}-${column}-${row}?`)) {
                    return;
                }
                // Clear the old location
                inventory[dupBay][dupColumn][dupRow] = "";
            }

            // Check for existing coil number at the same location
            if (!inventory[bay][column]) {
                inventory[bay][column] = {};
            }
            if (inventory[bay][column][row] !== undefined && inventory[bay][column][row] !== "") {
                if (!confirm(`Do you want to replace coil number ${inventory[bay][column][row]} with ${product} at ${bay}-${column}-${row}?`)) {
                    return;
                }
            }

            // Update inventory
            inventory[bay][column][row] = product;
            localStorage.setItem('inventory', JSON.stringify(inventory));
            console.log('Updated inventory:', inventory);
            displayInventory();
        }

        // Function to display inventory
        function displayInventory() {
    let entries = [];

    for (let bay in inventory) {
        for (let column in inventory[bay]) {
            for (let row in inventory[bay][column]) {
                if (inventory[bay][column][row] !== "") {
                    entries.push({
                        product: inventory[bay][column][row],
                        bay: bay,
                        column: column,
                        row: parseInt(row) // Convert row to number
                    });
                }
            }
        }
    }

    // Sort the entries
    entries.sort((a, b) => {
        if (a.bay < b.bay) return -1;
        if (a.bay > b.bay) return 1;
        if (a.column < b.column) return -1;
        if (a.column > b.column) return 1;
        if (a.row < b.row) return -1;
        if (a.row > b.row) return 1;
        if (a.product < b.product) return -1;
        if (a.product > b.product) return 1;
        return 0;
    });

    let tableHTML = '<table><tr><th>Select</th><th>Coil Number</th><th>Bay</th><th>Column</th><th>Row</th></tr>';

    entries.forEach(entry => {
        tableHTML += `<tr>
                        <td><input type="checkbox" class="delete-checkbox" data-bay="${entry.bay}" data-column="${entry.column}" data-row="${entry.row}"></td>
                        <td>${entry.product}</td>
                        <td>${entry.bay}</td>
                        <td>${entry.column}</td>
                        <td>${entry.row}</td>
                      </tr>`;
    });

    tableHTML += '</table>';
    document.getElementById('inventoryTable').innerHTML = tableHTML;
}

        // Function to delete selected entries
        function deleteSelectedEntries() {
            const checkboxes = document.querySelectorAll('.delete-checkbox:checked');
            if (checkboxes.length === 0) {
                alert('No entries selected for deletion.');
                return;
            }
            if (!confirm('Are you sure you want to delete the selected entries?')) {
                return;
            }
            checkboxes.forEach(checkbox => {
                const bay = checkbox.getAttribute('data-bay');
                const column = checkbox.getAttribute('data-column');
                const row = checkbox.getAttribute('data-row');
                inventory[bay][column][row] = "";
            });

            localStorage.setItem('inventory', JSON.stringify(inventory));
            console.log('Inventory after deletion:', inventory);
            displayInventory();
        }

// Function to download inventory as Excel
function downloadAsExcel() {
    let wb = XLSX.utils.book_new();
    let ws_data = [['Coil Tracking Update'], [''], ['Coil Number', 'Bay', 'Column', 'Row']];
 
    // Prepare data from displayed inventory
    let entries = [];
    for (let bay in inventory) {
        for (let column in inventory[bay]) {
            for (let row in inventory[bay][column]) {
                if (inventory[bay][column][row] !== "") {
                    entries.push({
                        product: inventory[bay][column][row],
                        bay: bay,
                        column: column,
                        row: parseInt(row) // Convert row to number
                    });
                }
            }
        }
    }
 
    // Sort entries based on bay, column, row, and product
    entries.sort((a, b) => {
        if (a.bay < b.bay) return -1;
        if (a.bay > b.bay) return 1;
        if (a.column < b.column) return -1;
        if (a.column > b.column) return 1;
        if (a.row < b.row) return -1;
        if (a.row > b.row) return 1;
        if (a.product < b.product) return -1;
        if (a.product > b.product) return 1;
        return 0;
    });
 
    // Populate worksheet data
    entries.forEach(entry => {
        ws_data.push([entry.product, entry.bay, entry.column, entry.row]);
    });
 
    let ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "Inventory");
    XLSX.writeFile(wb, "Inventory.xlsx");
}


// Function to download inventory as PDF
function downloadAsPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', format: 'a4' });
 
    const columns = Array.from({ length: 26 }, (_, i) => String.fromCharCode(65 + i)); // A to Z columns
    const rowNumbers = Array.from({ length: 20 }, (_, i) => i + 1); // Rows 1 to 20
 
    // Function to prepare table data for a bay
    const prepareTableDataForBay = (bay) => {
        let tableData = [];
 
        // Header row with column letters
        let headerRow = [''];
        headerRow.push(...columns);
        tableData.push(headerRow);
 
        // Data rows
        rowNumbers.forEach(row => {
            let rowData = [row];
            columns.forEach(column => {
                rowData.push(inventory[bay][column] && inventory[bay][column][row.toString()] ? inventory[bay][column][row.toString()] : "");
            });
            tableData.push(rowData);
        });
 
        return tableData;
    };
 
    for (let bay in inventory) {
        if (Object.keys(inventory[bay]).length > 0) {
            if (bay !== 'MN') {
                doc.addPage();
            }
 
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text("Coil Tracking Update", doc.internal.pageSize.getWidth() / 2, 20, { align: 'center' });
 
            doc.setFontSize(12);
            doc.setFont('helvetica', 'normal');
 
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.setFillColor(255, 255, 0); // Yellow background for header
            doc.setTextColor(0); // Black text color
            doc.text(`Bay: ${bay}`, 10, 30);
 
            let tableData = prepareTableDataForBay(bay);
            doc.autoTable({
                head: tableData.slice(0, 1), // First row is header
                body: tableData.slice(1), // Remaining rows are body
                startY: 40,
                columnStyles: {
                    0: { cellWidth: 15 }, // Adjust width of the first column if needed
                    // Set equal width for all columns except the first one
                    ...columns.reduce((styles, column) => {
                        styles[column] = { cellWidth: 15 }; // Adjust as needed
                        return styles;
                    }, {})
                },
                styles: {
                    fontSize: 8,
                    halign: 'center',
                    valign: 'middle',
                    lineColor: [0, 0, 0], // Black borders
                    lineWidth: 0.1,
                    fillColor: [255, 255, 255] // White background for body cells
                },
                headStyles: {
                    fillColor: [255, 255, 0], // Yellow background for header
                    textColor: [0, 0, 0], // Black text color for header
                    fontStyle: 'bold' // Bold font style for header
                },
                margin: { top: 10 },
                pageBreak: 'auto'
            });
        }
    }
 
    doc.save("Inventory.pdf");
}

        
        // Function to toggle select/deselect all
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.delete-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
        }

        // Initialize and display the inventory on page load
        displayInventory();
    </script>
</body>
</html>
